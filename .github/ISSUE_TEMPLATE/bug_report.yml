name: Bug report
description: Something in EasyTake doesn't work as it should.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Take a screenshot with Cmd+Shift+4
        2. ...
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: macOS 26.5
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: EasyTake version
      description: The release you installed, or the commit if you built it from source.
      placeholder: "0.1.4"
  - type: dropdown
    id: source
    attributes:
      label: Which source were you using?
      description: The selected source in the rope toolbar.
      options:
        - "Recent files"
        - "Clipboard and screenshots"
        - "Custom folder"
        - "Not sure"
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: A screenshot or a short recording helps a lot.
